name: Grade individual submission

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Public student repository (owner/name)'
        required: true
        type: string
      commit:
        description: 'Full 40-character submission commit SHA'
        required: true
        type: string
      week:
        description: 'Lab checks (baseline is setup verification only)'
        required: true
        type: choice
        options: ['baseline', '12', '13', '14']

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate input
        env:
          SUBMISSION_REPOSITORY: ${{ inputs.repository }}
          SUBMISSION_COMMIT: ${{ inputs.commit }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['SUBMISSION_REPOSITORY'])
          assert re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['SUBMISSION_COMMIT'])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: instructor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}
          path: submission
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Verify checked-out commit
        env:
          SUBMISSION_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git -C submission rev-parse HEAD)" = "${SUBMISSION_COMMIT,,}"
      - name: Install build tooling
        run: python -m pip install build 'setuptools>=77'
      - name: Run instructor's public checks
        env:
          LAB_WEEK: ${{ inputs.week }}
        run: python instructor/tools/autograde.py --repo submission --week "$LAB_WEEK" --output result.json
      - name: Show feedback
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('result.json')
          if p.is_file():
              data = json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps(data, ensure_ascii=False, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('## Public lab checks\n\n')
                  f.write('Commit: `' + data['submission_commit'] + '`\n\n')
                  for check in data['checks']:
                      f.write('- ' + ('PASS' if check['passed'] else 'FAIL') + ': ' + check['check'] + '\n')
                  f.write('\nFormative feedback only; final grades stay in LMS.\n')
          else:
              print('No report produced. Inspect the earlier checkout or setup step; this is not a student test verdict.')
          PY
