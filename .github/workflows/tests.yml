name: Python practice checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install learning project and build tool
        run: |
          python -m pip install -e .
          python -m pip install build
      - name: Check code and contribution data
        run: |
          python -m unittest discover -s tests -v
          python -m campus_tool --data-dir examples/submissions
      - name: Check baseline with public grader
        run: python tools/autograde.py --week baseline --output output/baseline-checks.json
      - name: Build distribution
        run: python -m build
      - name: Verify wheel outside the source directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/campus-wheel-check"
          "$RUNNER_TEMP/campus-wheel-check/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/campus-wheel-check/bin/python" -m campus_tool --category 식사 --max-price 5500
